{% extends "base.html" %}

{% block title %}Выбор действия - G-Budget{% endblock %}

{% block content %}
<div class="grid-2" style="max-width: 1000px; margin: 0 auto; min-height: 70vh; align-items: center;">
    <div class="card text-center">
        <div style="font-size: 4rem; margin-bottom: 24px; color: var(--accent-primary);">+</div>
        <h3 class="card-title">Создать новую семью</h3>
        <p class="text-secondary" style="margin: 16px 0;">Станьте администратором и создайте своё финансовое пространство</p>
        <a href="{{ url_for('main.create_family') }}" class="btn btn-primary w-full">Создать семью</a>
    </div>

    <div class="card text-center">
        <div style="font-size: 4rem; margin-bottom: 24px; color: var(--accent-primary);">→</div>
        <h3 class="card-title">Присоединиться к семье</h3>
        <p class="text-secondary" style="margin: 16px 0;">Введите код приглашения от администратора семьи</p>

        <div id="inviteError" class="alert alert-danger" style="display: none; margin-bottom: 16px;"></div>

        <form id="joinFamilyForm">
            <div class="form-group">
                <input type="text" id="invite_code" name="invite_code" placeholder="Введите код приглашения" required style="text-align: center; letter-spacing: 2px; font-family: monospace;">
            </div>
            <button type="submit" class="btn btn-secondary w-full">Присоединиться</button>
        </form>
    </div>
</div>

<script>
    document.getElementById('joinFamilyForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const code = document.getElementById('invite_code').value;
        const errorDiv = document.getElementById('inviteError');
        const submitBtn = this.querySelector('button[type="submit"]');
        const originalBtnText = submitBtn.textContent;

        // Скрываем предыдущую ошибку
        errorDiv.style.display = 'none';
        errorDiv.textContent = '';

        // Блокируем кнопку
        submitBtn.disabled = true;
        submitBtn.textContent = 'Проверка...';

        const formData = new FormData();
        formData.append('invite_code', code);

        try {
            const response = await fetch('{{ url_for("main.join_family_by_code") }}', {
                method: 'POST',
                headers: {
                    'X-Requested-With': 'XMLHttpRequest'
                },
                body: formData
            });

            const data = await response.json();

            if (data.success) {
                // Успешное присоединение - перенаправляем на дашборд
                window.location.href = data.redirect;
            } else {
                // Показываем ошибку
                errorDiv.textContent = data.error;
                errorDiv.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.textContent = originalBtnText;

                // Очищаем поле ввода
                document.getElementById('invite_code').value = '';
                document.getElementById('invite_code').focus();
            }
        } catch (err) {
            errorDiv.textContent = 'Ошибка соединения с сервером';
            errorDiv.style.display = 'block';
            submitBtn.disabled = false;
            submitBtn.textContent = originalBtnText;
        }
    });

    // Очищаем ошибку при вводе
    document.getElementById('invite_code').addEventListener('input', function() {
        const errorDiv = document.getElementById('inviteError');
        errorDiv.style.display = 'none';
    });
</script>
{% endblock %}
