{% extends "base.html" %}

{% block title %}Создание семьи - FamilyBudget{% endblock %}

{% block content %}
<div class="grid-2 mb-4">
    <div class="card" style="max-width: 600px; margin: 0 auto;">
        <h2 class="card-title" style="font-size: 1.8rem;">Создание семьи</h2>
        <p class="text-secondary" style="margin-bottom: 24px;">Вы будете администратором семьи с полными правами управления</p>

        <form method="POST">
            <div class="form-group">
                <label for="family_name">Название семьи</label>
                <input type="text" id="family_name" name="family_name" required placeholder="Например: Ивановы, Наша семья">
            </div>

            <button type="submit" class="btn btn-primary w-full">Создать семью</button>
        </form>
    </div>
</div>
{% endblock %}
