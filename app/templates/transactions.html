{% extends "base.html" %}

{% block title %}Транзакции - G-Budget{% endblock %}

{% block content %}
<div class="grid-2 mb-4">
    <div class="card">
        <div class="flex justify-between items-center mb-4">
            <h3 class="card-title" style="margin: 0;">История операций</h3>
            <a href="{{ url_for('main.add_transaction') }}" class="btn btn-primary">+ Добавить операцию</a>
        </div>

        <div class="table-container">
            <div class="table-wrapper">
                <table id="transactionsTable">
                    <thead>
                        <tr>
                            <th>Дата</th>
                            <th>Время</th>
                            <th>Автор</th>
                            <th>Категория</th>
                            <th>Сумма</th>
                            <th>Комментарий</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="transactionsTableBody">
                        <tr>
                            <td colspan="7" class="text-center text-secondary">Загрузка...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div class="modal-overlay" id="editTransactionModal" onclick="closeEditModalOnOverlay(event)">
    <div class="modal">
        <div class="modal-header">
            <h3 class="modal-title">Редактирование транзакции</h3>
            <button class="modal-close" onclick="closeEditModal()">&times;</button>
        </div>
        <div class="modal-body">
            <form id="editTransactionForm" onsubmit="event.preventDefault(); saveTransactionEdit();">
                <div class="form-group">
                    <label for="edit_category_id">Категория</label>
                    <select id="edit_category_id" required>
                        <option value="">Выберите категорию</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="edit_amount">Сумма</label>
                    <input type="number" id="edit_amount" step="0.01" min="0.01" required>
                </div>

                <div class="flex gap-2">
                    <div class="form-group" style="flex: 1;">
                        <label for="edit_date">Дата</label>
                        <input type="date" id="edit_date" required>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label for="edit_time">Время</label>
                        <input type="time" id="edit_time">
                    </div>
                </div>

                <div class="form-group">
                    <label for="edit_comment">Комментарий</label>
                    <textarea id="edit_comment" rows="3" placeholder="Описание операции..."></textarea>
                </div>

                <div id="editError" class="alert alert-danger" style="display: none; margin-bottom: 16px;"></div>

                <div class="modal-footer" style="padding-top: 0; border-top: none; margin-top: 8px;">
                    <button type="button" class="btn btn-secondary" onclick="closeEditModal()">Отмена</button>
                    <button type="submit" class="btn btn-primary">Сохранить</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    let editingTransactionId = null;
    let categoriesData = [];

    async function loadTransactions() {
        const tbody = document.getElementById('transactionsTableBody');
        tbody.innerHTML = '<tr><td colspan="7" class="text-center text-secondary">Загрузка...</td></tr>';

        try {
            const response = await fetch('/api/transactions');
            const data = await response.json();

            if (data.success && data.transactions) {
                categoriesData = data.categories;

                if (data.transactions.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" class="text-center text-secondary">Нет транзакций</td></tr>';
                    return;
                }

                tbody.innerHTML = data.transactions.map(txn => `
                    <tr data-id="${txn.id}" class="transaction-row">
                        <td class="date-cell">${txn.date}</td>
                        <td class="time-cell">${txn.time}</td>
                        <td>${escapeHtml(txn.author)}</td>
                        <td class="category-cell" data-category-id="${txn.category_id}" data-category-color="${txn.category_color}" style="color: ${txn.category_color}; font-weight: 500;">
                            ${escapeHtml(txn.category_name)}
                        </td>
                        <td class="amount-cell" style="color: ${txn.category_type === 'Расход' ? 'var(--error)' : 'var(--success)'}; font-weight: 600;">
                            ${txn.category_type === 'Расход' ? '-' : '+'} ${txn.amount.toFixed(2)}
                        </td>
                        <td class="comment-cell">${escapeHtml(txn.comment)}</td>
                        <td class="actions-cell">
                            <button class="edit-txn-btn" onclick="editTransaction(${txn.id})" title="Редактировать">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M17 3l4 4-7 7H10v-4l7-7z"></path>
                                    <path d="M4 20h16"></path>
                                </svg>
                            </button>
                            <button class="delete-txn-btn" onclick="deleteTransaction(${txn.id})" title="Удалить">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M4 7h16"></path>
                                    <path d="M10 11v6"></path>
                                    <path d="M14 11v6"></path>
                                    <path d="M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2l1-12"></path>
                                    <path d="M9 7V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v3"></path>
                                </svg>
                            </button>
                        </td>
                    </tr>
                `).join('');
            } else {
                tbody.innerHTML = '<tr><td colspan="7" class="text-center text-secondary">Ошибка загрузки данных</td></tr>';
            }
        } catch (err) {
            console.error('Error loading transactions:', err);
            tbody.innerHTML = '<tr><td colspan="7" class="text-center text-secondary">Ошибка соединения</td></tr>';
        }
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function updateCategoriesSelect(selectedId = null) {
        const select = document.getElementById('edit_category_id');
        if (!select) return;

        select.innerHTML = '<option value="">Выберите категорию</option>';

        categoriesData.forEach(cat => {
            const option = document.createElement('option');
            option.value = cat.id;
            option.textContent = `${cat.name} (${cat.type})`;
            option.style.color = cat.color;
            if (selectedId && selectedId == cat.id) {
                option.selected = true;
            }
            select.appendChild(option);
        });
    }

    function editTransaction(id) {
        editingTransactionId = id;
        const row = document.querySelector(`tr[data-id="${id}"]`);
        if (!row) return;

        const categoryId = row.querySelector('.category-cell').dataset.categoryId;
        const amountText = row.querySelector('.amount-cell').innerText;
        const amount = amountText.replace(/[+-]/g, '').trim();
        const date = row.querySelector('.date-cell').innerText.split('.').reverse().join('-');
        const time = row.querySelector('.time-cell').innerText;
        const comment = row.querySelector('.comment-cell').innerText;

        updateCategoriesSelect(parseInt(categoryId));

        document.getElementById('edit_amount').value = amount;
        document.getElementById('edit_date').value = date;
        document.getElementById('edit_time').value = time !== '—' ? time : '12:00';
        document.getElementById('edit_comment').value = comment !== '—' ? comment : '';

        document.getElementById('editError').style.display = 'none';

        document.getElementById('editTransactionModal').classList.add('active');
        document.body.style.overflow = 'hidden';

        setTimeout(() => {
            document.getElementById('edit_amount').focus();
        }, 100);
    }

    function closeEditModal() {
        document.getElementById('editTransactionModal').classList.remove('active');
        document.body.style.overflow = '';
        editingTransactionId = null;
        document.getElementById('editError').style.display = 'none';
    }

    function closeEditModalOnOverlay(event) {
        if (event.target === event.currentTarget) {
            closeEditModal();
        }
    }

    async function saveTransactionEdit() {
        const categoryId = document.getElementById('edit_category_id').value;
        const amount = document.getElementById('edit_amount').value;
        const date = document.getElementById('edit_date').value;
        const time = document.getElementById('edit_time').value;
        const comment = document.getElementById('edit_comment').value;
        const errorDiv = document.getElementById('editError');
        const saveBtn = document.querySelector('#editTransactionModal .btn-primary');

        if (!categoryId || !amount || !date) {
            errorDiv.textContent = 'Заполните обязательные поля';
            errorDiv.style.display = 'block';
            return;
        }

        errorDiv.style.display = 'none';
        if (saveBtn) {
            saveBtn.disabled = true;
            saveBtn.textContent = 'Сохранение...';
        }

        try {
            const response = await fetch(`/transaction/${editingTransactionId}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    category_id: parseInt(categoryId),
                    amount: parseFloat(amount),
                    date: date,
                    time: time,
                    comment: comment
                })
            });

            const data = await response.json();

            if (data.success) {
                showFlash('Транзакция обновлена', 'success');
                closeEditModal();
                await loadTransactions();
            } else {
                errorDiv.textContent = data.error || 'Ошибка при сохранении';
                errorDiv.style.display = 'block';
                if (saveBtn) {
                    saveBtn.disabled = false;
                    saveBtn.textContent = 'Сохранить';
                }
            }
        } catch (err) {
            errorDiv.textContent = 'Ошибка соединения с сервером';
            errorDiv.style.display = 'block';
            if (saveBtn) {
                saveBtn.disabled = false;
                saveBtn.textContent = 'Сохранить';
            }
        }
    }

    function deleteTransaction(id) {
        showConfirm(
            'Удалить транзакцию? Это действие нельзя отменить.',
            'Удаление транзакции',
            async function() {
                try {
                    const response = await fetch(`/transaction/${id}`, {
                        method: 'DELETE',
                        headers: { 'Content-Type': 'application/json' }
                    });

                    const data = await response.json();

                    if (data.success) {
                        showFlash('Транзакция удалена', 'success');
                        await loadTransactions();
                    } else {
                        showFlash('Ошибка: ' + data.error, 'danger');
                    }
                } catch (err) {
                    showFlash('Ошибка соединения с сервером', 'danger');
                }
            }
        );
    }

    document.addEventListener('DOMContentLoaded', function() {
        loadTransactions();

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeEditModal();
            }
        });
    });
</script>
{% endblock %}
